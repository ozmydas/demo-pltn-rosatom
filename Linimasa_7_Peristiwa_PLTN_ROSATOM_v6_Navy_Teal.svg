<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850"><rect width="1800" height="850" fill="#101f31"/><text x="55" y="64" font-family="Arial" font-size="38" font-weight="800" fill="#e8f4ff">TIMELINE ANALYSIS</text><rect x="55" y="94" width="1690" height="5" rx="2" fill="#69dfbb"/><path d="M60 390 H1734" stroke="#283f56" stroke-width="1"/><path d="M60 418 H1734" stroke="#283f56" stroke-width="1"/><path d="M60 446 H1734" stroke="#283f56" stroke-width="1"/><path d="M60 474 H1734" stroke="#283f56" stroke-width="1"/><path d="M60 502 H1734" stroke="#283f56" stroke-width="1"/><path d="M60 530 H1734" stroke="#283f56" stroke-width="1"/><path d="M102 360 V552" stroke="#25394f" stroke-width="1"/><path d="M367 360 V552" stroke="#25394f" stroke-width="1"/><path d="M632 360 V552" stroke="#25394f" stroke-width="1"/><path d="M897 360 V552" stroke="#25394f" stroke-width="1"/><path d="M1162 360 V552" stroke="#25394f" stroke-width="1"/><path d="M1427 360 V552" stroke="#25394f" stroke-width="1"/><path d="M1692 360 V552" stroke="#25394f" stroke-width="1"/><path d="M 102 467 C 192.1 467.0, 276.9 452.0, 367.0 452.0 C 457.1 452.0, 541.9 431.0, 632.0 431.0 C 722.1 431.0, 806.9 456.0, 897.0 456.0 C 987.1 456.0, 1071.9 401.0, 1162.0 401.0 C 1252.1 401.0, 1336.9 445.0, 1427.0 445.0 C 1517.1 445.0, 1601.9 420.0, 1692.0 420.0" fill="none" stroke="#64bcd4" stroke-width="5"/><path d="M102 467 L102 338" stroke="#40d0b8" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="50" y="134" width="224" height="204" rx="23" fill="#14283e" stroke="#40d0b8" stroke-width="3"/><text x="65" y="160" font-size="17" font-family="Arial" font-weight="800" fill="#40d0b8">EVENT 1 · 11–12 Okt 2</text><text x="65" y="187" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Target nasional 7 GW &amp;</text><text x="65" y="205" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">konsolidasi DEN–BRIN–Bappenas</text><text x="65" y="253" font-size="11.6" font-family="Arial" fill="#b3c8da">Peta jalan 7 GW, usulan satuan tugas</text><text x="65" y="269" font-size="11.6" font-family="Arial" fill="#b3c8da">lintas lembaga, Kalimantan Barat dan</text><text x="65" y="285" font-size="11.6" font-family="Arial" fill="#b3c8da">Bangka Belitung dipandang potensial,</text><text x="65" y="301" font-size="11.6" font-family="Arial" fill="#b3c8da">serta kunjungan evaluasi riset ke</text><text x="65" y="317" font-size="11.6" font-family="Arial" fill="#b3c8da">Serpong.</text><circle cx="102" cy="467" r="14" fill="#40d0b8" stroke="#14283e" stroke-width="3"/><text x="102" y="472" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">1</text><text x="102" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">12 Okt</text><path d="M367 452 L367 558" stroke="#77b6ef" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="255" y="558" width="224" height="204" rx="23" fill="#14283e" stroke="#77b6ef" stroke-width="3"/><text x="270" y="584" font-size="17" font-family="Arial" font-weight="800" fill="#77b6ef">EVENT 2 · 13 Okt 2026</text><text x="270" y="611" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Penjajakan kerja sama</text><text x="270" y="629" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">RI–Jepang terkait thorium</text><text x="270" y="677" font-size="11.6" font-family="Arial" fill="#b3c8da">Laporan menyebut penjajakan</text><text x="270" y="693" font-size="11.6" font-family="Arial" fill="#b3c8da">pengembangan pembangkit berbasis</text><text x="270" y="709" font-size="11.6" font-family="Arial" fill="#b3c8da">thorium dan panas bumi dalam</text><text x="270" y="725" font-size="11.6" font-family="Arial" fill="#b3c8da">pembicaraan bilateral RI–Jepang.</text><circle cx="367" cy="452" r="14" fill="#77b6ef" stroke="#14283e" stroke-width="3"/><text x="367" y="457" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">2</text><text x="367" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">13 Okt</text><path d="M632 431 L632 338" stroke="#62d0d8" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="520" y="134" width="224" height="204" rx="23" fill="#14283e" stroke="#62d0d8" stroke-width="3"/><text x="535" y="160" font-size="17" font-family="Arial" font-weight="800" fill="#62d0d8">EVENT 3 · 14–15 Okt 2</text><text x="535" y="187" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Diskusi publik, target tapak</text><text x="535" y="205" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">2027 &amp; kritik masyarakat</text><text x="535" y="223" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">sipil</text><text x="535" y="253" font-size="11.6" font-family="Arial" fill="#b3c8da">Forum Economic Frontline di Jakarta</text><text x="535" y="269" font-size="11.6" font-family="Arial" fill="#b3c8da">membahas NEPIO dan 28 lokasi</text><text x="535" y="285" font-size="11.6" font-family="Arial" fill="#b3c8da">potensial. BRIN menekankan uji bahaya</text><text x="535" y="301" font-size="11.6" font-family="Arial" fill="#b3c8da">berlapis; WALHI dan Gerakan Samataka</text><text x="535" y="317" font-size="11.6" font-family="Arial" fill="#b3c8da">meminta transparansi dan partisipasi</text><circle cx="632" cy="431" r="14" fill="#62d0d8" stroke="#14283e" stroke-width="3"/><text x="632" y="436" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">3</text><text x="632" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">14 Okt</text><path d="M897 456 L897 558" stroke="#a3a8ef" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="785" y="558" width="224" height="204" rx="23" fill="#14283e" stroke="#a3a8ef" stroke-width="3"/><text x="800" y="584" font-size="17" font-family="Arial" font-weight="800" fill="#a3a8ef">EVENT 4 · 15 Okt 2026</text><text x="800" y="611" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Target tahap pertama 1.500 MW</text><text x="800" y="629" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">&amp; tawaran lima negara</text><text x="800" y="677" font-size="11.6" font-family="Arial" fill="#b3c8da">Bahlil Lahadalia disebut menaikkan</text><text x="800" y="693" font-size="11.6" font-family="Arial" fill="#b3c8da">target tahap pertama dari 500 MW ke</text><text x="800" y="709" font-size="11.6" font-family="Arial" fill="#b3c8da">1.500 MW dan menyebut tawaran kerja</text><text x="800" y="725" font-size="11.6" font-family="Arial" fill="#b3c8da">sama dari Rusia, Jerman, Jepang,</text><text x="800" y="741" font-size="11.6" font-family="Arial" fill="#b3c8da">Korea Selatan, dan Kanada.</text><circle cx="897" cy="456" r="14" fill="#a3a8ef" stroke="#14283e" stroke-width="3"/><text x="897" y="461" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">4</text><text x="897" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">15 Okt</text><path d="M1162 401 L1162 338" stroke="#efbf69" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="1050" y="134" width="224" height="204" rx="23" fill="#14283e" stroke="#efbf69" stroke-width="3"/><text x="1065" y="160" font-size="17" font-family="Arial" font-weight="800" fill="#efbf69">EVENT 5 · 16–19 Okt 2</text><text x="1065" y="187" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Perjanjian PLTN terapung 200</text><text x="1065" y="205" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">MW Rosatom–Indonesia</text><text x="1065" y="253" font-size="11.6" font-family="Arial" fill="#b3c8da">Laporan menyebut perjanjian Rosatom</text><text x="1065" y="269" font-size="11.6" font-family="Arial" fill="#b3c8da">dan PT Pembangkit Listrik Nuklir</text><text x="1065" y="285" font-size="11.6" font-family="Arial" fill="#b3c8da">ditandatangani di Moskow pada 16 Okt</text><text x="1065" y="301" font-size="11.6" font-family="Arial" fill="#b3c8da">untuk wilayah utara Halmahera (2 ×</text><text x="1065" y="317" font-size="11.6" font-family="Arial" fill="#b3c8da">100 MW FPU-100/PEB-100, reaktor</text><circle cx="1162" cy="401" r="14" fill="#efbf69" stroke="#14283e" stroke-width="3"/><text x="1162" y="406" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">5</text><text x="1162" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">16 Okt</text><path d="M1427 445 L1427 558" stroke="#a99cf0" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="1315" y="558" width="224" height="204" rx="23" fill="#14283e" stroke="#a99cf0" stroke-width="3"/><text x="1330" y="584" font-size="17" font-family="Arial" font-weight="800" fill="#a99cf0">EVENT 6 · 16–17 Okt 2</text><text x="1330" y="611" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Insiden PLTN Onagawa &amp; seruan</text><text x="1330" y="629" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">penguatan keselamatan</text><text x="1330" y="677" font-size="11.6" font-family="Arial" fill="#b3c8da">Laporan memuat penghentian sementara</text><text x="1330" y="693" font-size="11.6" font-family="Arial" fill="#b3c8da">Reaktor No. 2 Onagawa setelah</text><text x="1330" y="709" font-size="11.6" font-family="Arial" fill="#b3c8da">kebocoran air dalam sistem internal</text><text x="1330" y="725" font-size="11.6" font-family="Arial" fill="#b3c8da">(tanpa paparan lingkungan menurut</text><text x="1330" y="741" font-size="11.6" font-family="Arial" fill="#b3c8da">laporan), dan peringatan Najmedin</text><circle cx="1427" cy="445" r="14" fill="#a99cf0" stroke="#14283e" stroke-width="3"/><text x="1427" y="450" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">6</text><text x="1427" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">17 Okt</text><path d="M1692 420 L1692 338" stroke="#f0a97f" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="1542" y="134" width="224" height="204" rx="23" fill="#14283e" stroke="#f0a97f" stroke-width="3"/><text x="1557" y="160" font-size="17" font-family="Arial" font-weight="800" fill="#f0a97f">EVENT 7 · 17–19 Okt 2</text><text x="1557" y="187" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Masukan PIKI &amp; sasaran COD</text><text x="1557" y="205" font-size="14" font-weight="700" font-family="Arial" fill="#f1f7ff">Sumatera 2032</text><text x="1557" y="253" font-size="11.6" font-family="Arial" fill="#b3c8da">Simposium PIKI menyampaikan</text><text x="1557" y="269" font-size="11.6" font-family="Arial" fill="#b3c8da">rekomendasi percepatan PLTN kepada</text><text x="1557" y="285" font-size="11.6" font-family="Arial" fill="#b3c8da">ESDM. Pemerintah menurut laporan</text><text x="1557" y="301" font-size="11.6" font-family="Arial" fill="#b3c8da">menargetkan PLTN darat/jaringan utama</text><text x="1557" y="317" font-size="11.6" font-family="Arial" fill="#b3c8da">pertama di Sumatera beroperasi pada</text><circle cx="1692" cy="420" r="14" fill="#f0a97f" stroke="#14283e" stroke-width="3"/><text x="1692" y="425" font-size="14" font-family="Arial" text-anchor="middle" font-weight="800" fill="#0a1828">7</text><text x="1692" y="530" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700" fill="#cbdbea">19 Okt</text><text x="55" y="829" font-family="Arial" font-size="16" fill="#98b2ca">Kurva digunakan sebagai ilustrasi urutan kejadian, bukan jumlah unggahan/mention per hari. Buka HTML untuk uraian lengkap setiap event.</text></svg>